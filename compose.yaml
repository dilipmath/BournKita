services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kita
      POSTGRES_PASSWORD: kita
      POSTGRES_DB: kita
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kita -d kita"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      KITA_DATABASE_URL: postgresql+psycopg://kita:kita@db:5432/kita
      KITA_CRASH_REPORT_EMAIL: ${KITA_CRASH_REPORT_EMAIL:-}
      # This stack serves plain HTTP, where browsers drop Secure cookies (except on localhost).
      # The production stack (compose.prod.yaml, HTTPS) leaves it on.
      KITA_SESSION_COOKIE_SECURE: ${KITA_SESSION_COOKIE_SECURE:-false}
      # Outgoing email goes to Mailpit, which catches it instead of delivering it:
      # read it at http://localhost:8025. Point these at a real mail server to send for real.
      KITA_SMTP_HOST: ${KITA_SMTP_HOST:-mailpit}
      KITA_SMTP_PORT: ${KITA_SMTP_PORT:-1025}
      KITA_SMTP_SECURITY: ${KITA_SMTP_SECURITY:-none}
      KITA_SMTP_USERNAME: ${KITA_SMTP_USERNAME:-}
      KITA_SMTP_PASSWORD: ${KITA_SMTP_PASSWORD:-}
      KITA_MAIL_FROM: ${KITA_MAIL_FROM:-Kita Kids Database <kita@localhost>}
      # Encrypts addresses, contact and health data. This default is for development only and
      # is public; the production stack (compose.prod.yaml) needs its own (`kita-admin generate-key`).
      KITA_ENCRYPTION_KEY: ${KITA_ENCRYPTION_KEY:-fdrh6GyPYGiTyjJtXojo6BBpfYqHzLJ9jiZhxclYbjA=}
      # Photo files, encrypted with the key above. Production backs them up nightly (compose.prod.yaml).
      KITA_PHOTO_FOLDER: /data/photos
    volumes:
      - photos:/data/photos
    # Large uploads wait here while they are read; in memory, an unencrypted photo never reaches
    # the disk.
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.20.0
    ports:
      - "8025:8025"

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  photos:

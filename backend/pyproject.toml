[project]
name = "kita"
version = "0.1.0"
description = "Kita Kids Database backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
kita-admin = "kita.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "mypy>=1.13",
    "ruff>=0.8",
    "hypothesis>=6.170.12",
    "aiosmtpd>=1.4.6",
    "trustme>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kita"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
